name: Build & Release

# v 태그 push 시 자동 실행 (예: git tag v3.3 && git push origin v3.3)
on:
  push:
    tags:
      - 'v*'

# Release 생성에 필요한 쓰기 권한 (필수)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install pyinstaller requests pywin32 pystray Pillow pyserial customtkinter pywin32-ctypes

      # PowerShell의 세미콜론 파싱 오류 방지를 위해 cmd로 빌드
      - name: Master 빌드
        shell: cmd
        run: >
          python -m PyInstaller
          --onefile --noconsole
          --name "LunchPop_Master"
          --icon "assets/logo.ico"
          --add-data "assets/alarm.wav;."
          --add-data "assets/logo.ico;."
          --hidden-import=win32print
          --hidden-import=win32api
          --hidden-import=pywintypes
          lunchpop_master.py

      - name: Launcher 빌드
        shell: cmd
        run: >
          python -m PyInstaller
          --onefile --noconsole
          --name "LunchPop_Launcher"
          --icon "assets/logo.ico"
          lunchpop_launcher.py

      - name: SHA256 계산
        id: sha256
        shell: powershell
        run: |
          $master = (Get-FileHash "dist\LunchPop_Master.exe" -Algorithm SHA256).Hash.ToLower()
          $launcher = (Get-FileHash "dist\LunchPop_Launcher.exe" -Algorithm SHA256).Hash.ToLower()
          echo "master=$master" >> $env:GITHUB_OUTPUT
          echo "launcher=$launcher" >> $env:GITHUB_OUTPUT
          echo "Master SHA256: $master"
          echo "Launcher SHA256: $launcher"

      - name: GitHub Release 생성 및 exe 업로드
        uses: softprops/action-gh-release@v2
        with:
          name: "런치팝 알리미 ${{ github.ref_name }}"
          body: |
            ## 변경사항
            - 업데이트 내용을 여기에 작성하세요.

            ## 신규 설치 (처음 설치하는 기기)
            1. `LunchPop_Launcher.exe` + `LunchPop_Master.exe` 같은 폴더에 저장
            2. `LunchPop_Launcher.exe` 실행 (이후 자동 시작 등록됨)

            ## 기존 기기 자동 업데이트
            버전관리 시트 업데이트 후 프로그램 재시작 시 자동 적용

            ## 버전관리 시트 업데이트 (관리자용)
            | 셀 | 값 |
            |---|---|
            | A2 | `${{ github.ref_name }}` 에서 v 제거한 숫자 |
            | B2 | Release에서 `LunchPop_Master.exe` 링크 복사 |
            | C2 | `${{ steps.sha256.outputs.master }}` |
          files: |
            dist/LunchPop_Master.exe
            dist/LunchPop_Launcher.exe
          make_latest: true
          # ⚠️ 저장소가 Private이면 아래 주석 해제
          # prerelease: false
